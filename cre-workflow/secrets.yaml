# Chainlink CRE Vault DON Secrets Aliases
# In production, encrypt and upload via CRE CLI:
#   cre secrets set --env staging --file secrets.yaml

secrets:
  - id: LLM_API_KEY
    description: "OpenAI API Key for in-enclave reasoning agent"
    type: string
    env: STAGING_LLM_API_KEY

  - id: MAX_SLIPPAGE_BPS
    description: "Maximum allowable tick slippage threshold for defensive repositioning"
    type: number
    env: STAGING_MAX_SLIPPAGE_BPS

  - id: ENCLAVE_SIGNER_KEY
    description: "ECDSA private key generated inside hardware enclave for attestation signing"
    type: string
    env: STAGING_ENCLAVE_SIGNER_KEY

  - id: GRAPH_API_KEY
    description: "The Graph Subgraph Studio Gateway API key for live indexing"
    type: string
    env: STAGING_GRAPH_API_KEY
